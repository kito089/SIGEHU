<div class="confirm-overlay" *ngIf="request$ | async as req" (click)="cancelar()" (keydown.escape)="cancelar()">
  <div class="confirm-dialog" role="alertdialog" aria-modal="true" [attr.aria-label]="req.titulo" (click)="$event.stopPropagation()">
    <div class="confirm-icon" [class.confirm-icon--danger]="req.danger">
      <ion-icon [name]="req.danger ? 'alert-circle-outline' : 'help-circle-outline'"></ion-icon>
    </div>

    <h3 class="confirm-title">{{ req.titulo }}</h3>
    <p class="confirm-message">{{ req.mensaje }}</p>

    <div class="confirm-actions">
      <button class="btn btn-secondary" type="button" (click)="cancelar()">
        {{ req.cancelarText }}
      </button>
      <button
        class="btn"
        [ngClass]="req.danger ? 'btn-danger' : 'btn-primary'"
        type="button"
        (click)="confirmar()"
      >
        {{ req.confirmarText }}
      </button>
    </div>
  </div>
</div>
