<div class="cf" [formGroup]="form">
  <h4 class="cf__title">Nuevo Contacto</h4>
  <div class="cf__grid">
    <app-input label="Nombre Completo" formControlName="nombreCompleto" [required]="true" placeholder="Nombre y apellido"></app-input>
    <app-input label="Teléfono" formControlName="telefono" type="tel" placeholder="10-15 dígitos" pattern="^[0-9]{10,15}$"></app-input>
    <app-input label="Email" formControlName="correo" type="email" placeholder="correo@ejemplo.com"></app-input>
    <app-input label="Observaciones" formControlName="observaciones" placeholder="Notas opcionales"></app-input>
  </div>
  <div class="cf__actions">
    <app-button variant="secondary" (buttonClick)="cancelled.emit()">Cancelar</app-button>
    <app-button variant="primary" (buttonClick)="submit()">Agregar</app-button>
  </div>
</div>
