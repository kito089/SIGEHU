<aside class="sidebar" [class.collapsed]="false">
  <!-- Logo Section -->
  <div class="sidebar-logo">
    <div class="logo-icon" aria-hidden="true">
      <img src="assets/logo/logo-placeholder.svg" alt="SIGEHU" class="logo-img" />
    </div>
    <div class="logo-text">
      <h1 class="logo-title">SIGEHU</h1>
      <p class="logo-subtitle">Herrería Utrilla</p>
    </div>
  </div>

  <!-- Navigation Section -->
  <nav class="sidebar-nav" aria-label="Navegación principal">
    <div class="nav-section">
      <h2 class="nav-section-title">MÓDULOS</h2>
      <ul class="nav-list" role="list">
        @for (item of navItems; track item.route) {
          <li class="nav-item">
            <a
              [routerLink]="item.route"
              routerLinkActive="active"
              [routerLinkActiveOptions]="{ exact: item.route === '/admin/dashboard' }"
              class="nav-link"
              [class.active]="isActive(item.route)"
              (click)="onNavClick()"
            >
              <span class="nav-icon" [innerHTML]="getSafeIconSvg(getIconName(item.icon))" aria-hidden="true"></span>
              <span class="nav-label">{{ item.label }}</span>
              @if (item.badge) {
                <span class="nav-badge">{{ item.badge }}</span>
              }
            </a>
          </li>
        }
      </ul>
    </div>
  </nav>

  <!-- User Footer -->
  <div class="sidebar-footer">
    <div class="user-info">
      <div class="user-avatar" [style.background-color]="'var(--sigehu-avatar-bg)'">
        {{ userInitials() }}
      </div>
      <div class="user-details">
        <p class="user-name">{{ userName() }}</p>
        <p class="user-role">{{ userRole() }}</p>
      </div>
    </div>
  </div>
</aside>
