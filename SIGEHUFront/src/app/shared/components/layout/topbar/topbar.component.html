<header class="topbar" role="banner">
  <div class="topbar-left">
    <img src="assets/icon/icon.png" alt="SIGEHU" class="topbar-logo" />
    <div class="topbar-titles">
      <h1 class="page-title">{{ pageTitle() }}</h1>
      @if (pageSubtitle()) {
        <p class="page-subtitle">{{ pageSubtitle() }}</p>
      }
    </div>
  </div>

  <div class="topbar-right">
    <!-- Buscador Global (Omnibox) - RF-31 -->
    <app-omnibox
      class="topbar-search"
    ></app-omnibox>

    <!-- Botón Nueva Obra -->
    <button
      class="btn btn-primary new-work-btn"
      (click)="onNewWork()"
      type="button"
    >
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
        <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
      </svg>
      <span>Nueva obra</span>
    </button>

    <!-- Centro de Notificaciones -->
    <div class="notif-wrap" #notifWrapper>
      <button
        class="icon-btn notification-btn"
        (click)="toggleNotifications()"
        [attr.aria-expanded]="panelAbierto()"
        aria-label="Notificaciones"
        aria-haspopup="dialog"
        type="button"
      >
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
          <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/>
        </svg>
        @if (notificationCount() > 0) {
          <span class="notification-dot" [attr.aria-label]="notificationCount() + ' notificaciones'"></span>
        }
      </button>

      @if (panelAbierto()) {
        <app-notifications-panel></app-notifications-panel>
      }
    </div>
  </div>
</header>
