<div class="main-layout">
  <!-- Sidebar desktop (sin cambios en ≥1024px) -->
  <app-sidebar
    class="layout-desktop-sidebar"
    [activeRoute]="currentRoute()"
  ></app-sidebar>

  <!-- Header móvil (visible solo en <1024px) -->
  <app-mobile-header
    class="layout-mobile-header"
    [pageTitle]="pageConfig.title"
    (newWorkClick)="onNewWork()"
  ></app-mobile-header>

  <!-- Content Wrapper -->
  <div class="content-wrapper">
    <!-- Topbar desktop (sin cambios en ≥1024px) -->
    <app-topbar
      class="layout-desktop-topbar"
      [pageTitle]="pageConfig.title"
      [pageSubtitle]="pageConfig.subtitle"
      (newWorkClick)="onNewWork()"
    ></app-topbar>

    <!-- Main Content -->
    <main class="main-content" role="main">
      <router-outlet></router-outlet>
    </main>
  </div>

  <!-- Bottom Navigation móvil (visible solo en <1024px) -->
  <app-mobile-bottom-nav
    class="layout-mobile-bottom-nav"
    [activeRoute]="currentRoute()"
  ></app-mobile-bottom-nav>
</div>
