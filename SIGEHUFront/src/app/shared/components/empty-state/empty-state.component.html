<div class="empty-state empty-state--{{ size }}">
  <ion-icon [name]="icon" class="empty__icon"></ion-icon>
  <h3 class="empty__title">{{ title }}</h3>
  <p class="empty__subtitle" *ngIf="subtitle">{{ subtitle }}</p>
  <app-button
    *ngIf="actionLabel"
    variant="primary"
    (buttonClick)="actionClick.emit()"
  >{{ actionLabel }}</app-button>
</div>
