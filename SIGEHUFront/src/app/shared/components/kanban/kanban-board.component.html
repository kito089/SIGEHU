<div class="kanban-board" role="region" aria-label="Tablero Kanban">
  @for (column of columns(); track column.id) {
    <app-kanban-column
      [column]="column"
      [class.kanban-column--oculta-movil]="column.id !== columnaActiva()"
      (cardClick)="onCardClick($event)"
    ></app-kanban-column>
  }
</div>
