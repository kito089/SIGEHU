<div class="login-page">
  <div class="login-card">

    <div class="brand">
      <div class="brand-icon">
        <img src="assets/icon.png" alt="SIGEHU" class="brand-logo-img" />
      </div>
      <h1>SIGEHU</h1>
      <p>Sistema Integral de Gestión · Herrería Utrilla</p>
    </div>

    <form [formGroup]="form" (ngSubmit)="onSubmit()" novalidate>

      <div class="field">
        <app-input
          class="login-field"
          label="Usuario"
          placeholder="Ej. carlos.utrilla"
          formControlName="usuario"
          [errorMessage]="usuarioCtrl?.touched && usuarioCtrl?.invalid ? 'Ingresa tu usuario' : ''"
          autocomplete="username"
          icon="person-outline"
        ></app-input>
      </div>

      <div class="field">
        <app-input
          class="login-field"
          label="Contraseña"
          placeholder="••••••••"
          type="password"
          formControlName="contrasena"
          [errorMessage]="contrasenaCtrl?.touched && contrasenaCtrl?.invalid ? 'Ingresa tu contraseña' : ''"
          autocomplete="current-password"
          icon="lock-closed-outline"
          [togglable]="true"
        ></app-input>
      </div>

      <div class="row-between">
        <label class="checkbox">
          <input type="checkbox" formControlName="recordarSesion">
          Recordar sesión
        </label>
        <button type="button" class="link-btn" (click)="onForgotPassword()">
          ¿Olvidaste tu contraseña?
        </button>
      </div>

      <div class="forgot-message" *ngIf="showForgotMessage()">
        Comunícate con el administrador para cambiar tu contraseña.
      </div>

      <div class="error-message" *ngIf="errorMessage()">
        {{ errorMessage() }}
      </div>

      <app-button
        class="submit-btn"
        type="submit"
        variant="primary"
        [disabled]="loading()"
        [fullWidth]="true"
      >
        <span *ngIf="!loading()">Ingresar al Sistema</span>
        <span *ngIf="loading()">Verificando…</span>
      </app-button>

    </form>

    <div class="footer-note">
      Panel de Acceso Único · Administrador y Trabajadores<br>
      Herrería Utrilla © 2026
    </div>

  </div>
</div>
