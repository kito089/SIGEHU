<!DOCTYPE html>
<html lang="es-MX">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SIGEHU · Dashboard</title>
</head>
<body>

  <header class="topbar">
    <div class="brand">
      <div class="brand-mark">SH</div>
      <div class="brand-text">
        <h1>SIGEHU</h1>
        <p>Sistema Integral de Gestión Empresarial · Herrería Utrilla</p>
      </div>
    </div>
  </header>

  <main>
    <section class="stats-row" id="statsRow"></section>

    <nav class="view-switcher">
      <button class="view-btn active" data-view="kanban">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="6" height="18" rx="1"/><rect x="11" y="3" width="6" height="10" rx="1"/><rect x="19" y="3" width="2" height="18" rx="1"/></svg>
        Kanban
      </button>
      <button class="view-btn" data-view="calendar">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18M8 2v4M16 2v4"/></svg>
        Calendario
      </button>
      <button class="view-btn" data-view="assigned">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg>
        Trabajos asignados
      </button>
    </nav>

    <section class="view-panel active" id="viewKanban">
      <div class="board-frame">
        <div class="board" id="board"></div>
      </div>
    </section>

    <section class="view-panel" id="viewCalendar">
      <div class="cal-frame">
        <div class="cal-header">
          <h3 id="calMonthLabel"></h3>
          <div class="cal-nav">
            <button id="calPrev" aria-label="Mes anterior">‹</button>
            <button id="calNext" aria-label="Mes siguiente">›</button>
          </div>
        </div>
        <div class="cal-grid" id="calGrid"></div>
      </div>
    </section>

    <section class="view-panel" id="viewAssigned">
      <div class="assigned-frame" id="assignedFrame"></div>
    </section>
  </main>

  <div class="modal-overlay" id="modalOverlay">
    <div class="modal" id="modalContent"></div>
  </div>

<script src="dashboard.js" defer></script>
</body>
</html>
