<div class="page">
  <app-entity-form
    [title]="esEdicion ? 'Editar Cliente' : 'Agregar Nuevo Cliente'"
    subtitle="Registra o actualiza la información general, contactos y configuración de facturación SAT del cliente"
    badgeText="Cliente"
    [loading]="loading"
    [submitting]="guardando"
    [submitLabel]="esEdicion ? 'Guardar Cambios' : 'Guardar Cliente'"
    (submitRequested)="onSubmit()"
    (cancelRequested)="cancelar()"
  >
    <form [formGroup]="form" (ngSubmit)="onSubmit()" novalidate>

      <div class="tipo-block">
        <div class="field">
          <label for="nombre" class="required-label">Nombre de la Empresa</label>
          <input
            id="nombre"
            type="text"
            formControlName="nombre"
            placeholder="Razón social o nombre comercial">
          <span class="field-error" *ngIf="form.get('nombre')?.touched && form.get('nombre')?.invalid">
            Ingresa el nombre de la empresa
          </span>
        </div>

        <div class="field">
          <label for="direccion">Dirección</label>
          <input
            id="direccion"
            type="text"
            formControlName="direccion"
            placeholder="Calle, número, colonia, ciudad">
        </div>

        <div class="field">
          <label for="observaciones">Observaciones / Notas internas</label>
          <textarea
            id="observaciones"
            rows="2"
            formControlName="observaciones"
            placeholder="Notas sobre el trato, acceso, referencias, etc."></textarea>
        </div>

        <!-- Contactos (min 1) -->
        <div class="contactos-wrap">
          <app-contact-list
            [contactos]="contactos()"
            (contactosChange)="onContactosChange($event)">
          </app-contact-list>
        </div>

        <!-- Datos fiscales: siempre visibles, sin switch -->
        <div class="fiscal-block" [formGroup]="fiscalGroup">
          <div class="field-row">
            <div class="field">
              <label for="rfc">RFC</label>
              <input id="rfc" type="text" formControlName="rfc" placeholder="Ej. UTCA850101AB1">
              <span class="field-error" *ngIf="form.get('fiscal')?.get('rfc')?.touched && form.get('fiscal')?.get('rfc')?.invalid">
                RFC inválido (12-13 caracteres)
              </span>
            </div>
            <div class="field">
              <label for="razonSocial">Razón Social</label>
              <input id="razonSocial" type="text" formControlName="razonSocial" placeholder="Razón social fiscal">
            </div>
          </div>

          <div class="field-row">
            <div class="field">
              <label for="regimen">Régimen Fiscal</label>
              <input
                id="regimen"
                type="text"
                autocomplete="off"
                [value]="labelCatalogo(form.get('fiscal')?.get('regimenFiscal')?.value ?? '', regimenesFiscales)"
                (focus)="abrirCombo('regimen')"
                (click)="abrirCombo('regimen')"
                (blur)="cerrarCombo()"
                (input)="busquedaRegimen.set($any($event.target).value)"
                placeholder="Busca un régimen…">
              <div class="combo-list" *ngIf="mostrarListaRegimen()">
                <button type="button" class="combo-item" *ngFor="let r of listadoRegimen()" (click)="seleccionarRegimen(r)">
                  {{ r.label }}
                </button>
                <div class="combo-empty" *ngIf="listadoRegimen().length === 0">Sin resultados</div>
              </div>
            </div>
            <div class="field">
              <label for="uso">Uso de CFDI</label>
              <input
                id="uso"
                type="text"
                autocomplete="off"
                [value]="labelCatalogo(form.get('fiscal')?.get('usoCFDI')?.value ?? '', usosCfdi)"
                (focus)="abrirCombo('uso')"
                (click)="abrirCombo('uso')"
                (blur)="cerrarCombo()"
                (input)="busquedaUso.set($any($event.target).value)"
                placeholder="Selecciona un uso…">
              <div class="combo-list" *ngIf="mostrarListaUso()">
                <button type="button" class="combo-item" *ngFor="let u of listadoUso()" (click)="seleccionarUso(u)">
                  {{ u.label }}
                </button>
                <div class="combo-empty" *ngIf="listadoUso().length === 0">Sin resultados</div>
              </div>
            </div>
          </div>

          <div class="field-row">
            <div class="field">
              <label for="cp">Código Postal Fiscal</label>
              <input id="cp" type="text" formControlName="codigoPostal" placeholder="5 dígitos">
              <span class="field-error" *ngIf="form.get('fiscal')?.get('codigoPostal')?.touched && form.get('fiscal')?.get('codigoPostal')?.invalid">
                Código postal de 5 dígitos
              </span>
            </div>
          </div>
        </div>
      </div>

    </form>
  </app-entity-form>

</div>
