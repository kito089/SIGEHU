<div class="dashboard-view">
  <header class="header">
    <div class="header-title">
      <button type="button" class="btn-back">← Volver</button>
      <h2>Editar Cliente</h2>
    </div>
    <span class="client-id-badge">ID: CLI-0024</span>
  </header>

  <div class="form-container">
    <form class="card-form">
      <!-- Sección: Información General -->
      <div class="form-section">
        <h3>Información General de Contacto</h3>
        
        <div class="form-grid">
          <div class="form-group span-2">
            <label>Nombre Completo / Razón Social <span class="required">*</span></label>
            <input 
              type="text" 
              value="María Elena Gómez" 
              placeholder="Ej. Juan Pérez u Organismo S.A." 
              required 
            />
          </div>

          <div class="form-group">
            <label>Teléfono Principal <span class="required">*</span></label>
            <input 
              type="tel" 
              value="4491234567" 
              placeholder="10 dígitos numéricos" 
              maxlength="10" 
              required 
            />
            <small class="hint">Requerido para contacto directo</small>
          </div>

          <div class="form-group">
            <label>Correo Electrónico (Opcional)</label>
            <input 
              type="email" 
              value="maria.gomez@email.com" 
              placeholder="cliente@ejemplo.com" 
            />
          </div>

          <div class="form-group span-2">
            <label>Dirección Completa de Instalación</label>
            <input 
              type="text" 
              value="Av. de la Cruz #405, Col. Rey Xolotl" 
              placeholder="Calle, Número, Colonia, Municipio" 
            />
          </div>
        </div>
      </div>

      <!-- Sección: Datos Fiscales con Switch Toggle -->
      <div class="form-section">
        <div class="section-toggle-header">
          <div>
            <h3>Datos Fiscales para Facturación</h3>
            <p class="subtitle">Activa esta opción únicamente si el cliente requiere factura CFDI</p>
          </div>
          <label class="switch">
            <input type="checkbox" [(ngModel)]="requiereFactura" name="requiereFactura" />
            <span class="slider round"></span>
          </label>
        </div>

        <!-- Campos Fiscales Condicionales -->
        <div class="form-grid fiscal-fields" *ngIf="requiereFactura">
          <div class="form-group">
            <label>RFC <span class="required">*</span></label>
            <input 
              type="text" 
              value="GOME850412H89" 
              placeholder="Ej. GOME850412XXX" 
              maxlength="13" 
            />
          </div>

          <div class="form-group">
            <label>Régimen Fiscal</label>
            <select>
              <option value="601">601 - General de Ley Personas Morales</option>
              <option value="612" selected>612 - Personas Físicas con Actividades Empresariales</option>
              <option value="626">626 - Régimen Simplificado de Confianza (RESICO)</option>
            </select>
          </div>

          <div class="form-group">
            <label>Código Postal Fiscal</label>
            <input type="text" value="20000" maxlength="5" />
          </div>

          <div class="form-group">
            <label>Uso del CFDI</label>
            <select>
              <option value="G01">G01 - Adquisición de mercancías</option>
              <option value="G03" selected>G03 - Gastos en general</option>
              <option value="P01">P01 - Por definir</option>
            </select>
          </div>
        </div>
      </div>

      <!-- Sección: Estado y Observaciones -->
      <div class="form-section">
        <h3>Estatus y Observaciones Internas</h3>
        <div class="form-grid">
          <div class="form-group">
            <label>Estatus del Cliente</label>
            <select class="status-select">
              <option value="activo" selected>Activo</option>
              <option value="inactivo">Inactivo (No se podrán crear nuevas obras)</option>
            </select>
          </div>

          <div class="form-group span-2">
            <label>Observaciones de Preferencia / Notas Internas</label>
            <textarea rows="3" placeholder="Ej. Cliente prefiere ser contactado únicamente por las tardes...">Cliente recurrente. Prefiere entregas en fines de semana.</textarea>
          </div>
        </div>
      </div>

      <!-- Acciones del Formulario -->
      <div class="form-actions">
        <button type="button" class="btn btn-secondary">Cancelar</button>
        <button type="submit" class="btn btn-blue">Guardar Cambios</button>
      </div>
    </form>
  </div>
</div>
