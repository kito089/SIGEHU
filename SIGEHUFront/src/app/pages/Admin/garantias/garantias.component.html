<div class="dashboard-view">
  <header class="header">
    <h2>Módulo de Garantías y Postventa</h2>
    <p class="subtitle">Gestión de reportes y reclamos</p>
  </header>

  <div class="grid-form-table">
    <div class="card">
      <h3>Abrir Ticket de Servicio</h3>
      <form class="form">
        <div class="form-group"><label>Obra</label><input type="text" /></div>
        <div class="form-group"><label>Tipo de falla</label><input type="text" /></div>
        <div class="form-group"><label>Descripción</label><input type="text" /></div>
        <div class="form-group"><label>Técnico</label><input type="text" /></div>
        <button type="button" class="btn btn-red btn-full">Generar Orden de Servicio</button>
      </form>
    </div>

    <div class="card">
      <h3>Tickets de Garantía</h3>
      <div class="ticket-list">
        <div class="ticket-card border-left-orange">
          <div class="ticket-header">
            <span>GAR-008</span>
            <span class="text-orange">En Revisión Técnica</span>
          </div>
          <p class="ticket-desc">Cliente y detalles del reporte...</p>
        </div>

        <div class="ticket-card border-left-blue">
          <div class="ticket-header">
            <span>GAR-007</span>
            <span class="text-blue">En Reparación</span>
          </div>
          <p class="ticket-desc">Cliente y detalles del reporte...</p>
        </div>
      </div>
    </div>
  </div>
</div>
