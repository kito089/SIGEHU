<div class="clientes-container">
  <h2>Registro de Cliente</h2>

  <form (ngSubmit)="saveClient()">
    <label for="name">Nombre *</label>
    <input id="name" name="name" [(ngModel)]="client.name" placeholder="Nombre completo" />

    <label for="phone">Teléfono *</label>
    <input id="phone" name="phone" [(ngModel)]="client.phone" placeholder="Teléfono" />

    <label for="email">Correo</label>
    <input id="email" name="email" [(ngModel)]="client.email" placeholder="Correo electrónico" />

    <div class="checkbox">
      <input type="checkbox" id="requiresInvoice" [(ngModel)]="client.requiresInvoice" name="requiresInvoice" />
      <label for="requiresInvoice">¿Requiere factura?</label>
    </div>

    <div *ngIf="client.requiresInvoice">
      <label for="rfc">RFC *</label>
      <input id="rfc" name="rfc" [(ngModel)]="client.rfc" placeholder="RFC" />

      <label for="taxRegime">Régimen Fiscal *</label>
      <input id="taxRegime" name="taxRegime" [(ngModel)]="client.taxRegime" placeholder="Régimen Fiscal" />

      <label for="postalCode">Código Postal *</label>
      <input id="postalCode" name="postalCode" [(ngModel)]="client.postalCode" placeholder="Código Postal" />
    </div>

    <button type="submit">Guardar Cliente</button>
    <button type="button" (click)="cancel()">Cancelar</button>
  </form>
</div>
