<ion-content class="ion-padding">

  <div class="mobile-header">
    <ion-button fill="clear" class="back-btn" (click)="volver()" aria-label="Volver">
      <ion-icon name="arrow-back-outline" slot="icon-only"></ion-icon>
    </ion-button>
    <h2>Garantías y Postventa</h2>
  </div>

  <!-- Nuevo Reporte (RF-24) -->
  <ion-card class="sigehu-card">
    <ion-card-header>
      <ion-card-title>Registrar Atención de Garantía</ion-card-title>
    </ion-card-header>
    <ion-card-content class="ion-no-padding">
      <ion-list>
        <ion-item class="sigehu-field">
          <ion-label position="stacked">Obra / Proyecto</ion-label>
          <ion-input [value]="obra" readonly></ion-input>
        </ion-item>
        <ion-item class="sigehu-field">
          <ion-label position="stacked">Fecha del Reporte</ion-label>
          <ion-input type="date" [(ngModel)]="fechaReporte"></ion-input>
        </ion-item>
        <ion-item class="sigehu-field">
          <ion-label position="stacked">Técnico Asignado</ion-label>
          <ion-select placeholder="Selecciona un técnico…">
            <ion-select-option *ngFor="let t of tecnicos" [value]="t.id">
              {{ t.nombre }}
            </ion-select-option>
          </ion-select>
        </ion-item>
        <ion-item class="sigehu-field">
          <ion-label position="stacked">Observaciones de la Falla</ion-label>
          <ion-textarea
            rows="3"
            placeholder="Chapa, pintura, bisagra…"></ion-textarea>
        </ion-item>
      </ion-list>
    </ion-card-content>
  </ion-card>

  <ion-button
    expand="block"
    size="large"
    class="sigehu-submit sigehu-submit--danger"
    (click)="guardarTicket()"
  >
    Guardar Ticket de Garantía
  </ion-button>

  <!-- Tickets en seguimiento (RF-25) -->
  <ion-card class="sigehu-card">
    <ion-card-header>
      <ion-card-title>Tickets en Seguimiento</ion-card-title>
    </ion-card-header>
    <ion-card-content class="ion-no-padding">
      <ion-list>
        <ion-item
          *ngFor="let ticket of tickets"
          lines="full"
          class="sigehu-ticket"
        >
          <ion-label>
            <h3>{{ ticket.id }}</h3>
            <p>{{ ticket.descripcion }}</p>
            <small>Técnico: {{ ticket.tecnico }}</small>
          </ion-label>
          <ion-badge slot="end" color="warning" class="ticket-badge">
            {{ ticket.estado }}
          </ion-badge>
        </ion-item>
      </ion-list>
    </ion-card-content>
  </ion-card>
</ion-content>
